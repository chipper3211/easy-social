{% extends "base.html" %}
{% block title %}Register - 郭騏禎's Easy Social{% endblock %}
{% block content %}
  <section class="auth-panel">
    <h1>Create account</h1>
    <form method="post" class="form-stack">
      <label>
        Username
        <input name="username" maxlength="40" autocomplete="username" required>
      </label>
      <label>
        Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="new-password" required>
      </label>
      <label>
        CAPTCHA
        <img
          class="captcha-image"
          src="{{ url_for('auth.captcha_image') }}"
          alt="CAPTCHA challenge"
          width="180"
          height="64"
        >
        <input name="captcha" autocomplete="off" inputmode="latin" required>
      </label>
      <button type="submit">Register</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
  </section>
{% endblock %}
